name: Security Scanner

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to scan'
        required: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Run Scan
        id: scan
        run: |
          echo "Scanning ${{ github.event.inputs.target_url }}..."
          
          # Fetch headers using curl
          HEADERS=$(curl -s -I -L "${{ github.event.inputs.target_url }}")
          
          # Save to output
          echo "headers<<EOF" >> $GITHUB_OUTPUT
          echo "$HEADERS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Result File
        run: |
          echo "## Scan Result for ${{ github.event.inputs.target_url }}" > result.md
          echo '```' >> result.md
          echo "${{ steps.scan.outputs.headers }}" >> result.md
          echo '```' >> result.md

      - name: Commit Result
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add result.md
          git commit -m "Scan results for ${{ github.event.inputs.target_url }}" || echo "No changes"
          git push
