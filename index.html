<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hexbytes CyberSec | Kuldeep</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #030508; --panel-bg: rgba(10, 15, 25, 0.7); --card-bg: rgba(13, 19, 28, 0.8);
    --primary: #00ff9d; --secondary: #00d9ff; --danger: #ff3c3c; --warning: #ffc800;
    --text: #e6edf3; --muted: #8b949e; --border: rgba(48, 54, 61, 0.8);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
    background: linear-gradient(-45deg, #030508, #06121e, #03140f, #030508); background-size: 400% 400%; animation: gradientBG 15s ease infinite;
  }
  @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  body::after { content: " "; display: block; position: absolute; inset: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%); background-size: 100% 4px; z-index: 999; pointer-events: none; opacity: 0.4; }
  
  #appContainer { display: flex; width: 100%; height: 100vh; flex-direction: row; }
  .sidebar { width: 280px; flex-shrink: 0; background: var(--panel-bg); backdrop-filter: blur(15px); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
  .brand { padding: 2rem 1.5rem; border-bottom: 1px solid var(--border); text-align: center; }
  .brand h1 { font-family: 'Fira Code'; font-size: 1.6rem; color: var(--primary); text-shadow: 0 0 10px rgba(0,255,157,0.4); }
  .brand p { font-size: 0.8rem; color: var(--secondary); margin-top: 0.5rem; text-transform: uppercase; letter-spacing: 2px; }
  
  .menu { list-style: none; padding: 1rem 0; flex: 1; }
  .menu li { padding: 1rem 1.5rem; cursor: pointer; display: flex; align-items: center; gap: 15px; font-size: 0.95rem; font-weight: 600; color: var(--muted); transition: 0.3s; border-left: 3px solid transparent; }
  .menu li svg { width: 20px; height: 20px; fill: currentColor; }
  .menu li:hover { background: rgba(0, 255, 157, 0.05); color: var(--text); }
  .menu li.active { background: linear-gradient(90deg, rgba(0, 255, 157, 0.15), transparent); color: var(--primary); border-left-color: var(--primary); text-shadow: 0 0 8px rgba(0,255,157,0.4); }

  .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { padding: 1.5rem 2rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--panel-bg); backdrop-filter: blur(10px); }
  .topbar h2 { font-size: 1.2rem; color: var(--text); display: flex; align-items: center; gap: 10px; }
  .topbar h2::before { content: "//"; color: var(--primary); font-family: 'Fira Code'; }
  .status { color: var(--primary); font-family: 'Fira Code'; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; background: rgba(0, 255, 157, 0.1); padding: 0.4rem 1rem; border-radius: 20px; border: 1px solid rgba(0,255,157,0.3); }
  .status::before { content: ""; width: 8px; height: 8px; background: var(--primary); border-radius: 50%; box-shadow: 0 0 10px var(--primary); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

  .tool-container { padding: 2rem; overflow-y: auto; flex: 1; display: none; }
  .tool-container.active { display: block; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; margin-bottom: 2rem; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, var(--primary), transparent); opacity: 0.6; }
  .card p { color: var(--muted); margin-bottom: 1.5rem; font-size: 0.95rem; }
  
  .input-group { display: flex; gap: 15px; margin-bottom: 1.5rem; }
  input[type="text"], input[type="password"] { flex: 1; padding: 1rem 1.2rem; background: rgba(0,0,0,0.5); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'Fira Code'; font-size: 1rem; outline: none; transition: 0.3s; }
  input[type="text"]:focus, input[type="password"]:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0,255,157,0.2); }
  button { padding: 1rem 2rem; background: var(--primary); border: none; border-radius: 8px; color: #000; font-weight: 800; font-size: 1rem; cursor: pointer; text-transform: uppercase; box-shadow: 0 0 15px rgba(0,255,157,0.3); transition: 0.3s; }
  button:hover { background: var(--secondary); box-shadow: 0 0 20px rgba(0,217,255,0.5); transform: translateY(-2px); }
  button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .terminal { background: #000; border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; font-family: 'Fira Code'; font-size: 0.9rem; min-height: 200px; max-height: 450px; overflow-y: auto; display: none; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); word-wrap: break-word; overflow-wrap: break-word; }
  .terminal .line { margin-bottom: 8px; line-height: 1.5; }
  .terminal .ok { color: var(--primary); }
  .terminal .bad { color: var(--danger); }
  .terminal .warn { color: var(--warning); }
  .terminal .info { color: var(--secondary); }
  
  .cursor { display: inline-block; width: 10px; height: 18px; background-color: var(--primary); animation: blink 1s step-end infinite; vertical-align: bottom; margin-left: 5px; }
  @keyframes blink { 50% { opacity: 0; } }

  @media (max-width: 850px) {
    #appContainer { flex-direction: column; overflow-y: auto; }
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
    .menu { display: flex; overflow-x: auto; padding: 0; }
    .menu li { padding: 1rem; border-left: none; border-bottom: 3px solid transparent; white-space: nowrap; }
    .menu li.active { border-left: none; border-bottom-color: var(--primary); background: transparent; }
    .main-content { overflow: visible; }
    .input-group { flex-direction: column; }
    .card { padding: 1.5rem; }
  }
</style>
</head>
<body>

  <div id="appContainer">
    <aside class="sidebar">
      <div class="brand"><h1>>_ HEXBYTES</h1><p>CyberSec by Kuldeep</p></div>
      <ul class="menu">
        <li class="active" onclick="switchTool('githubscan', this)"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>GitHub Scan Trigger</li>
      </ul>
    </aside>

    <main class="main-content">
      <div class="topbar"><h2 id="pageTitle">GitHub Scan Trigger</h2><div class="status">System Online</div></div>

      <div id="githubscan" class="tool-container active">
        <div class="card">
          <p>Yeh tool direct GitHub Actions ko trigger karega. Scan complete hone par <b>result.md</b> file repo mein banegi.</p>
          
          <div class="input-group">
            <input type="text" id="ghUsername" placeholder="GitHub Username" value="kuldeepLinux">
            <input type="text" id="ghRepo" placeholder="Repo Name" value="Hex-kuldeep">
          </div>
          <div class="input-group">
            <input type="text" id="targetUrl" placeholder="Target URL (e.g. https://hexbytes.in)">
            <button onclick="triggerGitHubAction()" id="btnGh">Run Scan</button>
          </div>
          
          <div id="termGh" class="terminal"></div>
        </div>
      </div>
    </main>
  </div>

<script>
  function switchTool(toolId, element) {
    document.querySelectorAll('.tool-container').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.menu li').forEach(el => el.classList.remove('active'));
    document.getElementById(toolId).classList.add('active');
    element.classList.add('active');
    document.getElementById('pageTitle').innerText = "GitHub Scan Trigger";
  }

  function typeTerminal(elementId, text, colorClass = '') {
    const term = document.getElementById(elementId); term.style.display = 'block';
    const oldCursor = term.querySelector('.cursor-container'); if(oldCursor) oldCursor.remove();
    const line = document.createElement('div'); line.className = 'line';
    line.innerHTML = `<span class="${colorClass}">${text}</span>`; term.appendChild(line);
    const cursorDiv = document.createElement('div'); cursorDiv.className = 'cursor-container';
    cursorDiv.innerHTML = `<span class="info">root@hexbytes:~#</span> <span class="cursor"></span>`; term.appendChild(cursorDiv);
    term.scrollTop = term.scrollHeight;
  }

  function triggerGitHubAction() {
    const user = document.getElementById('ghUsername').value;
    const repo = document.getElementById('ghRepo').value;
    const target = document.getElementById('targetUrl').value;

    if(!user || !repo || !target) return alert("Please fill all fields!");

    typeTerminal('termGh', `Triggering GitHub Action for: ${target}`, 'info');
    typeTerminal('termGh', `[i] Opening GitHub Actions page...`, 'warn');
    
    // GitHub Actions ko trigger karne ka direct link
    const url = `https://github.com/${user}/${repo}/actions/workflows/scan.yml`;
    
    setTimeout(() => {
      window.open(url, '_blank');
      typeTerminal('termGh', `[✓] Page Opened. Please click 'Run workflow', enter URL and run.`, 'ok');
      typeTerminal('termGh', `[i] Result will be in 'result.md' after 30 seconds.`, 'ok');
    }, 1500);
  }
</script>
</body>
</html>
